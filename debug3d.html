<!doctype html>
<!-- Dev-only 3D bench: one exercise at a time, scrubbable, with camera presets.
     Use it to tune poses and equipment placement. ?id=<exercise-id> -->
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D bench</title>
<link rel="stylesheet" href="./css/app.css">
<style>
  body { padding: 14px; }
  .stagewrap { width: min(560px, 100%); aspect-ratio: 1; background: var(--surface-2);
    border-radius: 20px; overflow: hidden; position: relative; }
  .bar2 { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; align-items: center; }
  select, input[type=range] { font: inherit; }
  .k { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
</style></head>
<body>
<div class="bar2">
  <select id="ex"></select>
  <button class="chip" data-a="hero">3/4</button>
  <button class="chip" data-a="front">front</button>
  <button class="chip" data-a="side">side</button>
  <button class="chip" data-a="back">back</button>
  <button class="chip" data-a="top">top</button>
  <button class="chip" id="play">pause</button>
  <span class="k" id="k"></span>
</div>
<div class="stagewrap" id="stage"></div>
<input type="range" id="t" min="0" max="1000" value="0" style="width:min(560px,100%);margin-top:10px">
<script type="module">
import { createViewer } from './js/three/viewer.js';
import { exercises, byId } from './js/data/back.js';
import { SCENES } from './js/data/back3d.js';

const sel = document.getElementById('ex');
for (const e of exercises) sel.insertAdjacentHTML('beforeend', `<option value="${e.id}">${e.name}</option>`);
const q = new URLSearchParams(location.search);
sel.value = q.get('id') || exercises[0].id;

let v = null, playing = true, t0 = performance.now();
function mount() {
  v?.dispose();
  document.getElementById('stage').innerHTML = '';
  v = createViewer(document.getElementById('stage'), byId[sel.value], { scene3d: SCENES[sel.value] });
  v.setTime(0);
}
mount();
sel.onchange = () => { history.replaceState({}, '', '?id=' + sel.value); mount(); };
document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { v.setAngle(b.dataset.a); v.setTime(cur); });
const play = document.getElementById('play');
play.onclick = () => { playing = !playing; play.textContent = playing ? 'pause' : 'play'; t0 = performance.now(); };
const slider = document.getElementById('t');
let cur = 0;
slider.oninput = () => { playing = false; play.textContent = 'play'; cur = slider.value / 1000; v.setTime(cur); document.getElementById('k').textContent = 't=' + cur.toFixed(2); };
function loop(now) {
  if (playing && v) {
    cur = ((now - t0) % 3000) / 3000;
    slider.value = cur * 1000;
    v.setTime(cur);
    document.getElementById('k').textContent = 't=' + cur.toFixed(2);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__v = () => v;
</script>
</body></html>
