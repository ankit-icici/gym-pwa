<!doctype html>
<!-- Dev-only contact sheet: every exercise at both keyframes, for eyeballing
     poses when authoring a new muscle group. Not part of the PWA shell. -->
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pose contact sheet</title>
<link rel="stylesheet" href="./css/app.css">
<style>
  body { padding: 16px; }
  .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell, 210px), 1fr)); gap: 14px; }
  .cell { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .pair > div { background: var(--surface-2); border-radius: 10px; aspect-ratio: 1; }
  .pair svg { width: 100%; height: 100%; }
  .lab { font-size: 12px; font-weight: 600; margin: 6px 2px 0; }
  .sub { font-size: 11px; color: var(--text-3); margin: 2px; }
</style></head>
<body>
<h1 style="font-size:18px;margin-bottom:12px">Pose contact sheet — start / peak</h1>
<div class="sheet" id="s"></div>
<script type="module">
import { createFigure } from './js/rig.js';
import { exercises } from './js/data/back.js';
const s = document.getElementById('s');
// ?only=id,id  narrows the sheet;  ?cell=460  blows the cells up for close inspection.
const q = new URLSearchParams(location.search);
const only = (q.get('only') || '').split(',').filter(Boolean);
document.documentElement.style.setProperty('--cell', (q.get('cell') || 210) + 'px');
const list = only.length ? exercises.filter((e) => only.includes(e.id)) : exercises;
for (const e of list) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  const pair = document.createElement('div');
  pair.className = 'pair';
  for (const u of [0, 0.5]) {
    const box = document.createElement('div');
    const f = createFigure(e);
    f.setTime(u);
    box.appendChild(f.svg);
    pair.appendChild(box);
  }
  cell.appendChild(pair);
  cell.insertAdjacentHTML('beforeend', `<div class="lab">${e.name}</div><div class="sub">${e.view} · ${e.equipment}</div>`);
  s.appendChild(cell);
}
</script>
</body></html>
